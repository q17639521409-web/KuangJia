name: Publish to NuGet

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore WebApi/FrameWebAPI.WebAPI/FrameWebAPI.WebAPI.sln

      - name: Build
        run: dotnet build WebApi/FrameWebAPI.WebAPI/FrameWebAPI.WebAPI.sln -c Release --no-restore

      - name: Pack
        run: dotnet pack WebApi/FrameWebAPI.WebAPI/FrameWebAPI.WebAPI/FrameWebAPI.WebAPI.csproj -c Release --no-build
      
      - name: List all nupkg files
        run: |
          echo "Current directory:"
          pwd
          echo "Finding all .nupkg files:"
          find . -name "*.nupkg" -type f
          echo "Checking bin/Release directory:"
          ls -la WebApi/FrameWebAPI.WebAPI/FrameWebAPI.WebAPI/bin/Release/ || echo "Directory not found"
      
      - name: Push to NuGet
        run: |
          dotnet nuget push WebApi/FrameWebAPI.WebAPI/FrameWebAPI.WebAPI/bin/Release/*.nupkg \
            --api-key ${{ secrets.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json
